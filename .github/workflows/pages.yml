name: Deploy AprovaIA to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - app.js
      - index.html
      - runtime-config.js
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Prepare static site
        env:
          APROVAIA_API_BASE_URL: ${{ vars.APROVAIA_API_BASE_URL }}
        run: |
          mkdir _site
          cp index.html app.js runtime-config.js _site/
          node -e "require('node:fs').writeFileSync('_site/runtime-config.js', 'window.APROVAIA_API_BASE_URL = ' + JSON.stringify(process.env.APROVAIA_API_BASE_URL || '') + ';\n')"
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Publish site
        id: deployment
        uses: actions/deploy-pages@v4
