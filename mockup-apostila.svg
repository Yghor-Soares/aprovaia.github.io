  <text x="866" y="308" font-family="Arial,sans-serif" font-size="11" font-weight="700" fill="#405367">Ponto de atenção</text>
  <text x="866" y="326" font-family="Arial,sans-serif" font-size="10" fill="#82909E">Diferença entre fenômenos</text>
  <rect x="278" y="389" width="856" height="278" rx="14" fill="#FFFFFF"/>
  <text x="307" y="429" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#172B45">Matéria e suas propriedades</text>
  <text x="307" y="462" font-family="Arial,sans-serif" font-size="12" fill="#526477">A química estuda a composição, as propriedades e as transformações da matéria.</text>
  <text x="307" y="483" font-family="Arial,sans-serif" font-size="12" fill="#526477">Tudo o que tem massa e ocupa espaço é matéria: a água de um copo, o ar e até</text>
  <text x="307" y="504" font-family="Arial,sans-serif" font-size="12" fill="#526477">os materiais que compõem os seres vivos.</text>
  <rect x="307" y="524" width="798" height="1" fill="#EDF0F2"/>
  <text x="307" y="554" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#405367">Substância pura ou mistura?</text>
  <text x="307" y="579" font-family="Arial,sans-serif" font-size="12" fill="#526477">Uma substância pura tem composição definida, como a água destilada. Já uma</text>
  <text x="307" y="600" font-family="Arial,sans-serif" font-size="12" fill="#526477">mistura combina duas ou mais substâncias — por exemplo, água com sal.</text>
  <rect x="307" y="617" width="798" height="31" rx="7" fill="#EAF3F2"/>
  <text x="322" y="637" font-family="Arial,sans-serif" font-size="11" font-weight="700" fill="#245E5A">Dica de prova:</text>
  <text x="400" y="637" font-family="Arial,sans-serif" font-size="11" fill="#426D68">observe se a questão descreve uma ou várias fases visíveis.</text>
  <rect x="278" y="685" width="856" height="195" rx="14" fill="#FFFFFF"/>
  <text x="307" y="724" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#172B45">Pratique com questões extras</text>
  <text x="307" y="748" font-family="Arial,sans-serif" font-size="11" fill="#82909E">Questões complementares para fixar este tópico.</text>
  <rect x="307" y="768" width="798" height="86" rx="9" fill="#FAFCFC" stroke="#E5EAED"/>
  <circle cx="331" cy="792" r="13" fill="#EAF3F2"/>
  <text x="331" y="796" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" font-weight="700" fill="#2C7A73">1</text>
  <text x="355" y="793" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="#405367">Qual alternativa descreve uma mistura homogênea?</text>
  <text x="355" y="816" font-family="Arial,sans-serif" font-size="11" fill="#657585">A) Água e óleo  ·  B) Água com sal dissolvido  ·  C) Areia e água</text>
  <text x="355" y="838" font-family="Arial,sans-serif" font-size="10" font-weight="700" fill="#2C7A73">VER RESPOSTA COMENTADA  ↓</text>
