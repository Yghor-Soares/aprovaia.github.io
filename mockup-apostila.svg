  <path d="M324 312h10m-5-5v10" stroke="#2C7A73" stroke-width="1.5" stroke-linecap="round"/>
  <text x="350" y="308" font-family="Arial,sans-serif" font-size="11" font-weight="700" fill="#405367">Conceitos essenciais</text>
  <text x="350" y="326" font-family="Arial,sans-serif" font-size="10" fill="#82909E">Matéria, substância e mistura</text>
  <rect x="565" y="284" width="245" height="57" rx="9" fill="#F7F9FA"/>
  <circle cx="587" cy="312" r="12" fill="#F0ECFA"/>
  <path d="M583 312l3 3 6-7" fill="none" stroke="#7965B5" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
