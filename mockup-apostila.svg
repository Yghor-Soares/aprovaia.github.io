  <rect x="278" y="133" width="132" height="24" rx="12" fill="#EAF3F2"/>
  <text x="344" y="149" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" font-weight="700" fill="#2C7A73">CAIU NA PROVA</text>
  <text x="425" y="150" font-family="Arial,sans-serif" font-size="11" fill="#82909E">Tópico 1 de 12 · 8 min de leitura</text>
  <rect x="278" y="177" width="856" height="194" rx="14" fill="#FFFFFF"/>
  <text x="307" y="215" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#172B45">O que você vai aprender</text>
  <text x="307" y="242" font-family="Arial,sans-serif" font-size="12" fill="#657585">Uma visão geral para compreender como a matéria é formada e como suas</text>
  <text x="307" y="262" font-family="Arial,sans-serif" font-size="12" fill="#657585">transformações aparecem nas questões da prova.</text>
